<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PureCheck</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#0f172a;
    --subtext:#64748b;
    --primary:#22c55e;
    --shadow:0 20px 50px rgba(0,0,0,0.12);
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --subtext:#cbd5e1;
    --primary:#22c55e;
    --shadow:0 20px 50px rgba(0,0,0,0.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    transition:0.4s;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:var(--card);
    border-radius:32px;
    padding:40px;
    text-align:center;
    box-shadow:var(--shadow);
    animation:fadeIn 0.8s ease;
    position:relative;
}

.theme-toggle{
    position:absolute;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:1.2rem;
    background:rgba(34,197,94,0.15);
    transition:0.3s;
}

.theme-toggle:hover{
    transform:scale(1.1);
}

.logo{
    width:140px;
    height:140px;
    margin:0 auto 20px;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

h1{
    color:var(--text);
    font-size:3rem;
    margin-bottom:10px;
}

.tagline{
    color:var(--subtext);
    font-size:1.1rem;
    margin-bottom:30px;
}

.description{
    color:var(--subtext);
    line-height:1.8;
    margin-bottom:35px;
    font-size:1rem;
}

.start-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px;
    background:var(--primary);
    color:white;
    font-size:1.1rem;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:translateY(-3px);
}

.footer{
    margin-top:25px;
    color:var(--subtext);
    font-size:0.9rem;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="container">

```
<div class="card">

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
        🌙
    </button>

    <div class="logo">
        <img src="PureCheck.png" alt="PureCheck Logo">
    </div>

    <h1>PureCheck</h1>

    <p class="tagline">
        Food Adulteration Detection App
    </p>

    <p class="description">
        Learn simple household methods to detect common food adulterants and promote food safety awareness.
    </p>

    <button class="start-btn" onclick="window.location.href='foods.html'">
        Get Started
    </button>

    <div class="footer">
        Safe Food • Safe Health • Safe Future
    </div>

</div>
```

</div>

<script>

const body = document.body;
const themeBtn = document.getElementById("themeBtn");

if(localStorage.getItem("theme") === "dark"){
    body.classList.add("dark");
    themeBtn.innerHTML = "☀️";
}

function toggleTheme(){

    body.classList.toggle("dark");

    if(body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        themeBtn.innerHTML = "☀️";
    }
    else{
        localStorage.setItem("theme","light");
        themeBtn.innerHTML = "🌙";
    }
}

</script>

</body>
</html>
